name: CFOS CI

# The knowledge layer in /content is the durable CustomerFirst asset. This workflow
# protects it on every push and pull request, independently of the Lovable app.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate knowledge layer (frontmatter, ids, cross-references)
        run: bun run content:validate

      - name: Tests (economics + content integrity)
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
