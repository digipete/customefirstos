name: CFOS CI

# The knowledge layer in /content is the durable CustomerFirst asset. This workflow
# protects it on every push and pull request, independently of the Lovable app.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock is generated inside the Lovable sandbox and pins every tarball to a
      # private sandbox registry that GitHub runners cannot authenticate against, and
      # bunfig.toml adds sandbox-only install rules. Both are removed here so CI
      # resolves the same package.json version ranges from public npm. Neither file is
      # changed in the repository.
      - name: Prepare public-registry install
        run: rm -f bun.lock bunfig.toml

      - name: Install dependencies
        run: bun install
        env:
          npm_config_registry: https://registry.npmjs.org

      - name: Validate knowledge layer (frontmatter, ids, cross-references)
        run: bun run content:validate

      - name: Tests (economics + content integrity)
        run: bun run test

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
