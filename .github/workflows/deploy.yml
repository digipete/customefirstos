name: Deploy to GitHub Pages

# Runs only on pushes to main (not PRs) and can be triggered manually from the
# Actions tab. It performs a STATIC build of the TanStack Start app — the
# github-pages nitro preset (see vite.config.ts) — and publishes the .output/public
# directory to GitHub Pages via the official deploy-pages action.
#
# Before this works, enable Pages on the repo:
#   Settings > Pages > Source: "GitHub Actions"  (not "Deploy from a branch").
#
# The app is served from the /customefirstos/ project path, so every asset URL is
# prefixed accordingly by vite.config.ts (CFOS_STATIC=true).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Grants the deploy job permission to publish a Pages deployment and lets one
# in-flight deployment cancel a previous one.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # bun.lock is generated inside the Lovable sandbox and pins every tarball to a
      # private sandbox registry that GitHub runners cannot authenticate against, and
      # bunfig.toml adds sandbox-only install rules. Removing both makes CI resolve the
      # package.json version ranges from public npm instead.
      - name: Prepare public-registry install
        run: rm -f bun.lock bunfig.toml

      - name: Install dependencies
        run: bun install
        env:
          npm_config_registry: https://registry.npmjs.org

      # A malformed Markdown document must never reach the published site.
      - name: Validate knowledge layer
        run: bun run content:validate

      # CFOS_STATIC=true makes vite.config.ts emit a static (prerendered) build with
      # base /customefirstos/ and the github-pages nitro preset.
      - name: Build static site
        run: CFOS_STATIC=true bun run build

      # Fail loudly here rather than publishing an empty artifact.
      - name: Verify static output
        run: |
          if [ ! -f .output/public/index.html ]; then
            echo "Static build produced no .output/public/index.html — the github-pages preset did not prerender."
            ls -R .output || true
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The github-pages preset writes prerendered output to .output/public and adds
      # .nojekyll so Jekyll doesn't mangle the assets.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
